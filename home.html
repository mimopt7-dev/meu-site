<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Mundial 2026</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #111827;
  color: white;
  display: flex;
}

/* MENU */
.sidebar {
  width: 250px;
  background: #0b3d91;
  height: 100vh;
  padding: 20px;
}

.sidebar h2 {
  color: #facc15;
}

button {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: rgba(255,255,255,0.1);
  color: white;
}

button:hover {
  background: #facc15;
  color: black;
}

/* CONTENT */
.content {
  flex: 1;
  padding: 20px;
}

.card {
  background: rgba(255,255,255,0.1);
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
  cursor: pointer;
}

.card:hover {
  background: rgba(255,255,255,0.2);
  transform: scale(1.01);
  transition: 0.2s;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>⚽ Mundial 2026</h2>

  <button onclick="showTeams()">Equipas (48)</button>
  <button onclick="showCalendar()">Calendário</button>
  <button onclick="showHome()">Início</button>
</div>

<div class="content">

  <h1 id="title">Bem-vindo 👋</h1>
  <div id="area"></div>

</div>

<script>

/* =========================
   48 SELEÇÕES + BANDEIRAS
========================= */

const teams = {
  "🇵🇹 Portugal": ["Ronaldo", "Bruno Fernandes", "Bernardo Silva", "João Félix", "Rafael Leão"],
  "🇧🇷 Brasil": ["Vinícius Jr", "Neymar", "Rodrygo", "Alisson", "Casemiro"],
  "🇦🇷 Argentina": ["Messi", "Lautaro Martínez", "Enzo Fernández", "De Paul"],
  "🇫🇷 França": ["Mbappé", "Griezmann", "Camavinga", "Tchouaméni"],
  "🇩🇪 Alemanha": ["Musiala", "Wirtz", "Kimmich", "Havertz"],
  "🇪🇸 Espanha": ["Pedri", "Gavi", "Rodri", "Yamal"],
  "🏴 Inglaterra": ["Kane", "Bellingham", "Saka", "Foden"],
  "🇮🇹 Itália": ["Donnarumma", "Barella", "Chiesa", "Tonali"],
  "🇳🇱 Holanda": ["De Jong", "Van Dijk", "Gakpo", "Simons"],
  "🇧🇪 Bélgica": ["De Bruyne", "Lukaku", "Trossard"],

  "🇺🇾 Uruguai": ["Valverde", "Núñez", "Bentancur"],
  "🇭🇷 Croácia": ["Modric", "Kovacic", "Gvardiol"],
  "🇲🇽 México": ["Jiménez", "Lozano", "Ochoa"],
  "🇺🇸 EUA": ["Pulisic", "McKennie", "Reyna"],
  "🇨🇦 Canadá": ["David", "Larin", "Buchanan"],

  "🇯🇵 Japão": ["Kubo", "Mitoma", "Endo"],
  "🇰🇷 Coreia do Sul": ["Son Heung-min", "Kim Min-jae", "Lee Kang-in"],
  "🇦🇺 Austrália": ["Ryan", "Leckie", "Boyle"],
  "🇲🇦 Marrocos": ["Hakimi", "Ziyech", "En-Nesyri"],
  "🇸🇳 Senegal": ["Mané", "Koulibaly", "Mendy"],

  "🇨🇭 Suíça": ["Xhaka", "Shaqiri", "Akanji"],
  "🇩🇰 Dinamarca": ["Eriksen", "Højbjerg", "Schmeichel"],
  "🇳🇴 Noruega": ["Haaland", "Ødegaard", "Sørloth"],
  "🇵🇱 Polónia": ["Lewandowski", "Zielinski", "Szczesny"],

  "🇨🇱 Chile": ["Alexis Sánchez", "Vidal", "Brereton"],
  "🇨🇴 Colômbia": ["Luis Díaz", "James", "Duran"],
  "🇪🇨 Equador": ["Caicedo", "Hincapié", "Valencia"],
  "🇵🇪 Peru": ["Guerrero", "Cueva", "Tapia"],

  "🇳🇬 Nigéria": ["Osimhen", "Iwobi", "Ndidi"],
  "🇬🇭 Gana": ["Partey", "Ayew", "Inaki Williams"],
  "🇨🇲 Camarões": ["Aboubakar", "Onana", "Anguissa"],

  "🇪🇬 Egito": ["Salah", "Elneny", "Hegazi"],
  "🇩🇿 Argélia": ["Mahrez", "Bounedjah", "Atal"],
  "🇹🇳 Tunísia": ["Sliti", "Dräger", "Maaloul"],

  "🇮🇷 Irão": ["Taremi", "Azmoun", "Hajsafi"],
  "🇸🇦 Arábia Saudita": ["Al-Dawsari", "Al-Shehri", "Al-Owais"],
  "🇶🇦 Qatar": ["Afif", "Almoez Ali", "Hassan"],

  "🇵🇦 Panamá": ["Carrasquilla", "Gómez", "Escobar"],
  "🇨🇷 Costa Rica": ["Navas", "Campbell", "Borges"],
  "🇭🇳 Honduras": ["Quioto", "Lozano", "Menjívar"]
};

/* ========================= */

function showTeams() {
  document.getElementById("title").innerText = "⚽ Equipas do Mundial 2026";

  let html = "";

  for (let team in teams) {
    html += `
      <div class="card" onclick="showPlayers('${team}')">
        ${team}
      </div>
    `;
  }

  document.getElementById("area").innerHTML = html;
}

function showPlayers(team) {
  document.getElementById("title").innerText = team;

  let html = `<div class="card" onclick="showTeams()">⬅ Voltar</div>`;

  teams[team].forEach(player => {
    html += `<div class="card">${player}</div>`;
  });

  document.getElementById("area").innerHTML = html;
}

function showCalendar() {
  document.getElementById("title").innerText = "📅 Calendário";

  document.getElementById("area").innerHTML = `
    <div class="card">Portugal vs Brasil</div>
    <div class="card">França vs Argentina</div>
    <div class="card">Espanha vs Alemanha</div>
  `;
}

function showHome() {
  document.getElementById("title").innerText = "Bem-vindo 👋";

  document.getElementById("area").innerHTML = `
    <div class="card">Seleciona uma equipa para ver jogadores ⚽</div>
  `;
}

</script>

</body>
</html>
