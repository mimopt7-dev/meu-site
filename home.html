<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Mundial 2026</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #111827;
  color: white;
  display: flex;
}

/* MENU */
.sidebar {
  width: 250px;
  background: #0b3d91;
  height: 100vh;
  padding: 20px;
  overflow-y: auto;
}

.sidebar h2 {
  color: #facc15;
}

button {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  background: rgba(255,255,255,0.1);
  border: none;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: #facc15;
  color: black;
}

/* CONTENT */
.content {
  flex: 1;
  padding: 20px;
}

.card {
  background: rgba(255,255,255,0.1);
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>⚽ Mundial 2026</h2>
  <button onclick="showTeams()">Equipas (48)</button>
  <button onclick="showCalendar()">Calendário</button>
  <button onclick="logout()">Sair</button>
</div>

<div class="content">
  <h1 id="title">Bem-vindo 👋</h1>
  <div id="area"></div>
</div>

<script>

/* =========================
   48 SELEÇÕES (BASE MVP)
========================= */

  "Holanda": ["De Jong", "Gakpo", "Van Dijk"],
  "Bélgica": ["De Bruyne", "Lukaku", "Trossard"],

  "Uruguai": ["Valverde", "Núñez", "Bentancur"],
  "Croácia": ["Modrić", "Kovačić", "Gvardiol"],
  "México": ["Jiménez", "Lozano", "Ochoa"],

/* =========================
   FUNÇÕES
========================= */

function showTeams() {
  document.getElementById("title").innerText = "⚽ Todas as Equipas (48)";

  let html = "";

  for (let team in teams) {
    html += `
      <div class="card">
        <h3>${team}</h3>
        <p>${teams[team].join(", ")}</p>
      </div>
    `;
  }

  document.getElementById("area").innerHTML = html;
}

function showCalendar() {
  document.getElementById("title").innerText = "📅 Calendário";

  document.getElementById("area").innerHTML = `
    <div class="card">Portugal vs Brasil - 12 Junho</div>
    <div class="card">França vs Argentina - 13 Junho</div>
    <div class="card">Inglaterra vs Alemanha - 14 Junho</div>
  `;
}

function logout() {
  window.location.href = "index.html";
}

</script>

</body>
</html>
