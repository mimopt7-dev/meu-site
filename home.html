<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Mundial 2026 App</title>

<style>
html,body{
  margin:0;
  height:100%;
  font-family:Arial;
}

/* LOGIN */
#loginPage{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background:#111827;
  color:white;
}

.loginBox{
  display:flex;
  flex-direction:column;
  gap:10px;
  width:260px;
}

input{
  padding:10px;
  border:none;
  border-radius:8px;
}

button{
  padding:10px;
  background:#facc15;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* APP */
.app{
  display:none;
  min-height:100vh;
}

.sidebar{
  width:260px;
  background:#0b3d91;
  color:white;
  padding:20px;
}

.sidebar h2{
  color:#facc15;
}

.sidebar button{
  width:100%;
  margin:5px 0;
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.content{
  flex:1;
  position:relative;
  padding:20px;
  color:white;
}

.bg{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
  filter:brightness(0.35);
  z-index:-1;
}

h1{
  text-align:center;
  color:#facc15;
}

.card{
  background:rgba(255,255,255,0.15);
  padding:12px;
  margin:10px auto;
  width:80%;
  border-radius:10px;
  text-align:center;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
  <div class="loginBox">
    <h2>⚽ Login</h2>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Entrar</button>
    <button onclick="registar()">Registar</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">

  <div class="sidebar">
    <h2>⚽ Mundial 2026</h2>
    <button onclick="home()">Início</button>
    <button onclick="showTeams()">Equipas</button>
    <button onclick="calendar()">Calendário</button>
  </div>

  <div class="content">
    <div class="bg" id="bg"></div>
    <h1 id="title">Bem-vindo</h1>
    <div id="area"></div>
  </div>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* 🔥 OBRIGATÓRIO: substituir pelo teu Firebase real */
const firebaseConfig = {
  apiKey: "COLOCA_AQUI",
  authDomain: "COLOCA_AQUI",
  projectId: "COLOCA_AQUI",
  storageBucket: "COLOCA_AQUI",
  messagingSenderId: "COLOCA_AQUI",
  appId: "COLOCA_AQUI"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = function(){
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  signInWithEmailAndPassword(auth,email,pass)
  .then(()=>{
    document.getElementById("loginPage").style.display="none";
    document.getElementById("app").style.display="flex";
  })
  .catch(e=>alert(e.message));
}

window.registar = function(){
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  createUserWithEmailAndPassword(auth,email,pass)
  .then(()=>alert("Conta criada"))
  .catch(e=>alert(e.message));
}
</script>

<script>

/* EQUIPAS */
const teams = {
  "Portugal":"https://upload.wikimedia.org/wikipedia/commons/5/5c/Flag_of_Portugal.svg",
  "Brasil":"https://upload.wikimedia.org/wikipedia/en/0/05/Flag_of_Brazil.svg",
  "França":"https://upload.wikimedia.org/wikipedia/en/c/c3/Flag_of_France.svg",
  "Argentina":"https://upload.wikimedia.org/wikipedia/commons/1/1a/Flag_of_Argentina.svg"
};

function players(team){
  let arr=[];
  for(let i=1;i<=22;i++){
    arr.push(team+" jogador "+i);
  }
  return arr;
}

function home(){
  document.getElementById("title").innerText="Mundial 2026";
  document.getElementById("area").innerHTML="<div class='card'>Escolhe uma seleção</div>";
}

function showTeams(){
  document.getElementById("title").innerText="Equipas";

  let html="";
  for(let t in teams){
    html+=`<div class='card' onclick='openTeam("${t}")'>${t}</div>`;
  }

  document.getElementById("area").innerHTML=html;
}

function openTeam(t){
  document.getElementById("bg").style.backgroundImage=`url(${teams[t]})`;

  document.getElementById("title").innerText=t;

  let html="<div class='card' onclick='showTeams()'>⬅ Voltar</div>";

  players(t).forEach(p=>{
    html+=`<div class='card'>${p}</div>`;
  });

  document.getElementById("area").innerHTML=html;
}

function calendar(){
  document.getElementById("title").innerText="Calendário";

  document.getElementById("area").innerHTML=`
    <div class='card'>Portugal vs Brasil</div>
    <div class='card'>França vs Argentina</div>
  `;
}

</script>

</body>
</html>
