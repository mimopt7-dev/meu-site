<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Mundial 2026 - Dashboard</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #111827;
  color: white;
  display: flex;
}

/* SIDEBAR */
.sidebar {
  width: 250px;
  background: #0b3d91;
  height: 100vh;
  padding: 20px;
  overflow-y: auto;
}

.sidebar h2 {
  color: #facc15;
}

button {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  background: rgba(255,255,255,0.1);
  border: none;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: #facc15;
  color: black;
}

/* CONTENT */
.content {
  flex: 1;
  padding: 20px;
}

.card {
  background: rgba(255,255,255,0.1);
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
}

/* BANNER */
.banner {
  background: rgba(255,255,255,0.08);
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
  text-align: center;
}

.banner img {
  width: 100%;
  max-width: 500px;
  border-radius: 12px;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>⚽ Mundial 2026</h2>

  <button onclick="showHome()">Início</button>
  <button onclick="showTeams()">Equipas (48)</button>
  <button onclick="showCalendar()">Calendário</button>
  <button onclick="logout()">Sair</button>
</div>

<div class="content">

  <h1 id="title">Bem-vindo 👋</h1>

  <!-- 🇵🇹 BANNER -->
  <div class="banner">
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/5c/Portugal_national_football_team_2018.jpg">
    <h2 style="color:#facc15;">Seleção Nacional de Portugal 🇵🇹</h2>
    <p>Bem-vindo ao teu portal do Mundial 2026</p>
  </div>

  <div id="area"></div>

</div>

<script>

/* =========================
   EQUIPAS (48 + estrelas reais)
========================= */

const teams = {
  "Portugal": ["Cristiano Ronaldo", "Bruno Fernandes", "Bernardo Silva", "João Félix", "Rafael Leão", "Diogo Costa"],
  "Brasil": ["Vinícius Jr", "Neymar", "Rodrygo", "Alisson", "Marquinhos", "Casemiro"],
  "Argentina": ["Messi", "Lautaro Martínez", "Enzo Fernández", "De Paul", "Álvarez"],
  "França": ["Mbappé", "Griezmann", "Tchouaméni", "Camavinga", "Upamecano"],
  "Alemanha": ["Musiala", "Wirtz", "Kimmich", "Havertz", "Neuer"],
  "Espanha": ["Pedri", "Gavi", "Rodri", "Yamal", "Morata"],
  "Inglaterra": ["Kane", "Bellingham", "Saka", "Foden", "Rice"],
  "Itália": ["Donnarumma", "Barella", "Chiesa", "Raspadori", "Tonali"],
  "Holanda": ["De Jong", "Van Dijk", "Gakpo", "Simons", "Ake"],
  "Bélgica": ["De Bruyne", "Lukaku", "Trossard", "Onana", "Carrasco"],

  "Uruguai": ["Valverde", "Núñez", "Bentancur", "Araujo", "Suaréz"],
  "Croácia": ["Modric", "Kovacic", "Gvardiol", "Perisic", "Livakovic"],
  "México": ["Jiménez", "Lozano", "Ochoa", "Álvarez", "Corona"],
  "EUA": ["Pulisic", "Reyna", "McKennie", "Weah", "Dest"],
  "Canadá": ["David", "Buchanan", "Larin", "Eustaquio", "Koné"],

  "Japão": ["Kubo", "Mitoma", "Endo", "Ito", "Kamada"],
  "Coreia do Sul": ["Son Heung-min", "Kim Min-jae", "Hwang", "Lee Kang-in", "Jung"],
  "Austrália": ["Ryan", "Leckie", "Boyle", "Goodwin", "Mooy"],
  "Marrocos": ["Hakimi", "Ziyech", "En-Nesyri", "Amrabat", "Bounou"],
  "Senegal": ["Mané", "Koulibaly", "Mendy", "Sarr", "Diatta"],

  "Suíça": ["Xhaka", "Shaqiri", "Sow", "Akanji", "Freuler"],
  "Dinamarca": ["Eriksen", "Højbjerg", "Dolberg", "Hjulmand", "Schmeichel"],
  "Noruega": ["Haaland", "Ødegaard", "Sørloth", "Ryerson", "Ajer"],
  "Polónia": ["Lewandowski", "Zielinski", "Szczesny", "Kiwior", "Cash"],

  "Chile": ["Alexis Sánchez", "Vidal", "Brereton", "Diaz", "Pulgar"],
  "Colômbia": ["Luis Díaz", "James Rodríguez", "Duran", "Ospina", "Cuadrado"],
  "Equador": ["Caicedo", "Valencia", "Hincapié", "Estupiñán", "Plata"],
  "Peru": ["Guerrero", "Cueva", "Tapia", "Gallese", "Carrillo"],

  "Nigéria": ["Osimhen", "Iwobi", "Ndidi", "Chukwueze", "Bassey"],
  "Gana": ["Partey", "Ayew", "Inaki Williams", "Lamptey", "Salisu"],
  "Camarões": ["Aboubakar", "Onana", "Anguissa", "Toko Ekambi", "Choupo-Moting"]
};

/* ========================= */

function showHome() {
  document.getElementById("title").innerText = "Bem-vindo 👋";

  document.getElementById("area").innerHTML = `
    <div class="card">
      Portal oficial do Mundial 2026 ⚽
    </div>
  `;
}

function showTeams() {
  document.getElementById("title").innerText = "⚽ Equipas do Mundial 2026";

  let html = "";

  for (let t in teams) {
    html += `
      <div class="card">
        <h3>${t}</h3>
        <p>${teams[t].join(", ")}</p>
      </div>
    `;
  }

  document.getElementById("area").innerHTML = html;
}

function showCalendar() {
  document.getElementById("title").innerText = "📅 Calendário";

  document.getElementById("area").innerHTML = `
    <div class="card">Portugal vs Brasil - 12 Junho</div>
    <div class="card">França vs Argentina - 13 Junho</div>
    <div class="card">Espanha vs Alemanha - 14 Junho</div>
  `;
}

function logout() {
  window.location.href = "index.html";
}

</script>

</body>
</html>
