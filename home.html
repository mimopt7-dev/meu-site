<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>Mundial 2026</title>

<style>
body{
  margin:0;
  font-family:Arial;
  color:white;
}

/* FUNDO TOTAL PORTUGAL */
.background{
  min-height:100vh;
  background:url("https://upload.wikimedia.org/wikipedia/commons/5/5c/Flag_of_Portugal.svg") center/cover no-repeat;
  position:relative;
  display:flex;
}

/* ESCURECER FUNDO */
.background::after{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
}

/* SIDEBAR */
.sidebar{
  width:250px;
  background:rgba(11,61,145,0.9);
  padding:20px;
  position:relative;
  z-index:1;
}

.sidebar h2{
  color:#facc15;
}

button{
  width:100%;
  padding:10px;
  margin:6px 0;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:rgba(255,255,255,0.1);
  color:white;
}

button:hover{
  background:#facc15;
  color:black;
}

/* CONTENT */
.content{
  flex:1;
  padding:20px;
  position:relative;
  z-index:1;
}

/* TITLE */
#title{
  text-align:center;
  font-size:42px;
  color:#facc15;
  margin-top:10px;
}

/* CARDS */
.card{
  background:rgba(255,255,255,0.15);
  margin:10px auto;
  padding:15px;
  width:80%;
  border-radius:10px;
  text-align:center;
  backdrop-filter:blur(6px);
  cursor:pointer;
}

.card:hover{
  background:rgba(255,255,255,0.25);
}
</style>
</head>

<body>

<div class="background">

  <!-- MENU -->
  <div class="sidebar">
    <h2>⚽ Mundial 2026</h2>

    <button onclick="showHome()">Início</button>
    <button onclick="showTeams()">Equipas</button>
    <button onclick="showCalendar()">Calendário</button>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <h1 id="title">⚽ Bem-vindo ao Mundial 2026</h1>

    <div id="area"></div>

  </div>

</div>

<script>

/* =========================
   EQUIPAS (EXEMPLO BASE)
========================= */

const teams = {
  "🇵🇹 Portugal": ["Ronaldo", "Bruno Fernandes", "Bernardo Silva"],
  "🇧🇷 Brasil": ["Vinícius Jr", "Neymar", "Rodrygo"],
  "🇦🇷 Argentina": ["Messi", "Lautaro Martínez", "Enzo Fernández"],
  "🇫🇷 França": ["Mbappé", "Griezmann", "Camavinga"],
  "🇩🇪 Alemanha": ["Musiala", "Wirtz", "Kimmich"],
  "🇪🇸 Espanha": ["Pedri", "Gavi", "Rodri"],
  "🏴 Inglaterra": ["Kane", "Bellingham", "Saka"]
};

/* ========================= */

function showHome(){
  document.getElementById("title").innerText = "⚽ Bem-vindo ao Mundial 2026";

  document.getElementById("area").innerHTML = `
    <div class="card">
      🌍 Explora equipas, jogadores e jogos do maior torneio do mundo
    </div>
  `;
}

function showTeams(){
  document.getElementById("title").innerText = "⚽ Equipas";

  let html = "";

  for(let t in teams){
    html += `<div class="card" onclick="showPlayers('${t}')">${t}</div>`;
  }

  document.getElementById("area").innerHTML = html;
}

function showPlayers(team){
  document.getElementById("title").innerText = team;

  let html = `<div class="card" onclick="showTeams()">⬅ Voltar</div>`;

  teams[team].forEach(p=>{
    html += `<div class="card">${p}</div>`;
  });

  document.getElementById("area").innerHTML = html;
}

function showCalendar(){
  document.getElementById("title").innerText = "📅 Calendário";

  document.getElementById("area").innerHTML = `
    <div class="card">Portugal vs Brasil</div>
    <div class="card">França vs Argentina</div>
    <div class="card">Espanha vs Alemanha</div>
  `;
}

/* INICIAL */
showHome();

</script>

</body>
</html>
