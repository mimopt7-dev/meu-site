<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Home - Mundial 2026</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      display: flex;
    }

    /* SIDEBAR */
    .sidebar {
      width: 240px;
      background: #0b3d91;
      height: 100vh;
      padding: 20px;
    }

    .sidebar h2 {
      color: #facc15;
      margin-bottom: 20px;
    }

    .menu button {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: rgba(255,255,255,0.1);
      color: white;
      text-align: left;
      font-weight: bold;
    }

    .menu button:hover {
      background: #facc15;
      color: black;
    }

    /* CONTENT */
    .content {
      flex: 1;
      padding: 30px;
    }

    h1 {
      color: #facc15;
    }

    .card {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 12px;
    }

  </style>
</head>

<body>

  <!-- MENU -->
  <div class="sidebar">
    <h2>⚽ Mundial 2026</h2>

    <div class="menu">
      <button onclick="showEquipas()">Equipas</button>
      <button onclick="showCalendario()">Calendário</button>
      <button onclick="logout()">Sair</button>
    </div>
  </div>

  <!-- CONTEÚDO -->
  <div class="content">

    <h1 id="titulo">Bem-vindo 👋</h1>

    <div id="area">
      <div class="card">
        Seleciona uma opção no menu à esquerda
      </div>
    </div>

  </div>

  <script>

    /* =========================
       EQUIPAS (48 SELEÇÕES BASE)
    ========================== */

    const equipas = {
      "Portugal": ["Ronaldo", "Bruno Fernandes", "Bernardo Silva", "João Félix", "Rafael Leão"],
      "Brasil": ["Vinícius Jr", "Neymar", "Rodrygo", "Alisson", "Marquinhos"],
      "França": ["Mbappé", "Griezmann", "Camavinga", "Tchouaméni", "Upamecano"],
      "Argentina": ["Messi", "Lautaro Martínez", "Enzo Fernández", "De Paul", "Otamendi"],
      "Alemanha": ["Musiala", "Havertz", "Wirtz", "Kimmich", "Neuer"],
      "Espanha": ["Pedri", "Gavi", "Morata", "Rodri", "Yamal"]
    };

    function showEquipas() {
      document.getElementById("titulo").innerText = "⚽ Equipas do Mundial 2026";

      let html = "";

      for (let pais in equipas) {
        html += `
          <div class="card">
            <h3>🇳🇱 ${pais}</h3>
            <p>${equipas[pais].join(", ")}</p>
          </div>
        `;
      }

      document.getElementById("area").innerHTML = html;
    }

    /* =========================
       CALENDÁRIO
    ========================== */

    function showCalendario() {
      document.getElementById("titulo").innerText = "📅 Calendário";

      document.getElementById("area").innerHTML = `
        <div class="card">
          <h3>Portugal vs Brasil</h3>
          <p>12 Junho 2026</p>
        </div>

        <div class="card">
          <h3>França vs Argentina</h3>
          <p>13 Junho 2026</p>
        </div>

        <div class="card">
          <h3>Alemanha vs Espanha</h3>
          <p>14 Junho 2026</p>
        </div>
      `;
    }

    /* =========================
       LOGOUT
    ========================== */

    function logout() {
      window.location.href = "index.html";
    }

  </script>

</body>
</html>
